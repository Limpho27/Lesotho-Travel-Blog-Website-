<!DOCTYPE html>
<html>
<head>
    <title>Gallery</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:#111;
            color:white;
        }

        header{
            background:#000;
            text-align:center;
            padding:20px;
        }

        header h1{
            margin-bottom:10px;
            font-size:40px;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:0 15px;
            font-weight:bold;
            transition:0.3s;
        }

        nav a:hover{
            color:gold;
        }

        .content{
            padding:40px;
        }

        /* GALLERY GRID */

        .gallery{
            display:grid;
            grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));
            gap:20px;
        }

        .gallery img{
            width:100%;
            height:250px;
            object-fit:cover;
            border-radius:12px;
            transition:0.5s;
            box-shadow:0 5px 15px rgba(0,0,0,0.5);
        }

        .gallery img:hover{
            transform:scale(1.05);
        }

        /* VIDEO SECTION */

        .video-section{
            margin-top:60px;
        }

        .video-section h2{
            text-align:center;
            margin-bottom:30px;
            font-size:35px;
            color:gold;
        }

        .videos{
            display:grid;
            grid-template-columns:repeat(auto-fit, minmax(350px, 1fr));
            gap:25px;
        }

        .videos video{
            width:100%;
            border-radius:12px;
            box-shadow:0 5px 15px rgba(0,0,0,0.5);
        }

        /* SOCIALS */

        .socials{
            text-align:center;
            margin-top:50px;
            font-size:18px;
        }

        .socials a{
            color:gold;
            text-decoration:none;
            margin:0 10px;
        }

        footer{
            background:#000;
            text-align:center;
            padding:20px;
            margin-top:40px;
        }

    </style>

</head>
